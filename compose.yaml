services:
  studio:
    build: .
    ports:
      - "127.0.0.1:5173:5173"
    env_file: .env
    volumes:
      - studio-data:/app/.wrangler
      - ./.dev.vars:/app/.dev.vars:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    command: ["npm", "run", "db:migrate"]
    volumes:
      - studio-data:/app/.wrangler
    profiles: ["tools"]
  worker:
    build:
      context: .
      dockerfile: services/Dockerfile
    env_file: .env
    environment:
      WORKER_APP_URL: http://studio:5173
    volumes:
      - worker-data:/app/worker-state
    profiles: ["generation"]
    depends_on:
      studio:
        condition: service_healthy
    restart: unless-stopped
volumes:
  studio-data:
  worker-data:
